<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Editar Chefe

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-dark text-white">


<div class="container py-5">


<h1 class="text-center mb-5">

Editar Chefe

</h1>


<div
class="mx-auto p-4 rounded-4"
style="
max-width:700px;
background:#1c1c1c;
">

<form method="POST" enctype="multipart/form-data">


<div class="mb-4">

<label class="form-label">

Nome

</label>

<input
type="text"
name="nome"
class="form-control"
value="{{ chefe.nome }}"
required>

</div>


<div class="mb-4">

<label class="form-label">

Cargo

</label>

<input
type="text"
name="cargo"
class="form-control"
value="{{ chefe.cargo }}"
required>

</div>


<div class="mb-4">

<label class="form-label">

Foto atual

</label>

<br>

{% if chefe.imagem %}
<img
src="{{ url_for('static', filename='imagens/' + chefe.imagem) }}"
style="max-width:220px;border-radius:10px;margin-bottom:15px;">
{% else %}
<p class="text-secondary">Sem foto cadastrada</p>
{% endif %}

</div>

<div class="mb-4">

<label class="form-label">

Escolher nova foto (opcional)

</label>

<input
type="file"
name="imagem"
class="form-control"
accept=".jpg,.jpeg,.png,.webp">

<small class="text-secondary">

Se nenhuma foto for selecionada, a atual será mantida.

</small>

</div>


<button
type="submit"
class="btn btn-warning w-100">

Salvar Alterações

</button>


<a
href="/admin/chefes"
class="btn btn-outline-light w-100 mt-3">

Voltar

</a>


</form>


</div>


</div>

</body>

</html>
