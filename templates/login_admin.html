<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container py-5">

<div
class="mx-auto p-4 rounded-4"
style="
max-width:500px;
background:#1c1c1c;
">

<h1 class="text-center mb-4">

Área Administrativa

</h1>

<form method="POST">

<input
type="text"
name="usuario"
class="form-control mb-3"
placeholder="Usuário"
required>

<input
type="password"
name="senha"
class="form-control mb-3"
placeholder="Senha"
required>

<button
type="submit"
class="btn btn-danger w-100">

Entrar

</button>

</form>

{% if mensagem %}

<div class="alert alert-danger mt-3">

{{ mensagem }}

</div>

{% endif %}

</div>

</div>

</body>

</html>
