<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil | Confeitaria Luar Rubro</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Josefin Sans', sans-serif;
    }

    body {
      background-color: #0d0d0d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0e0e0;
    }

    .profile-card {
      background-color: #161616;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .profile-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #e63946;
      margin-bottom: 5px;
      font-weight: normal;
    }

    .profile-subtitle {
      font-size: 0.95rem;
      color: #a0a0a0;
      margin-bottom: 30px;
    }

    .profile-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #b3b3b3;
    }

    .form-control {
      background-color: #22252a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-control:focus {
      border-color: #e63946;
      background-color: #2a2d34;
    }

    .btn-submit {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn-submit:hover {
      background-color: #d62828;
    }

    .btn-delete {
      background-color: transparent;
      color: #e63946;
      border: 1px solid #e63946;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-delete:hover {
      background-color: rgba(230, 57, 70, 0.1);
    }

    .divider {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.08);
      margin: 25px 0 15px 0;
    }

    .back-link {
      display: inline-block;
      color: #a0a0a0;
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 15px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #ffffff;
    }

    .alert-msg {
      background-color: rgba(230, 57, 70, 0.15);
      border: 1px solid #e63946;
      color: #ff8080;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="profile-card">
    <h1 class="profile-title">Meu Perfil</h1>
    <p class="profile-subtitle">Atualize suas informações pessoais</p>

    {% if mensagem %}
      <div class="alert-msg">
        {{ mensagem }}
      </div>
    {% endif %}

    <!-- FORMULÁRIO DE ATUALIZAÇÃO DA CONTA -->
    <form class="profile-form" action="/perfil" method="POST" novalidate>
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" class="form-control" value="{{ usuario.nome or '' }}" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="text" id="email" name="email" class="form-control" value="{{ usuario.email or '' }}" placeholder="Seu e-mail">
      </div>

      <div class="form-group">
        <label for="senha">Nova Senha (deixe em branco se não quiser alterar)</label>
        <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit">Salvar Alterações</button>
    </form>

    <div class="divider"></div>

    <!-- FORMULÁRIO DE EXCLUSÃO DA CONTA -->
    <form action="/deletar-conta" method="POST" onsubmit="return confirmarExclusao();">
      <button type="submit" class="btn-delete">Excluir Minha Conta</button>
    </form>

    <a href="/" class="back-link">
      &larr; Voltar para o site
    </a>
  </div>

  <script>
    function confirmarExclusao() {
      return confirm("Tem certeza de que deseja excluir sua conta? Esta ação não poderá ser desfeita.");
    }
  </script>

</body>

</html>
