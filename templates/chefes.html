<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Chefes | Luar Rubro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
      body.chefes-page {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      body.chefes-page main {
        flex: 1;
      }
    </style>
</head>

<body class="chefes-page">

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('homepage') }}">
                Luar Rubro
            </a>
        </div>
    </nav>

    <main class="container py-5 mt-5">
        <h2 class="text-center text-white mb-5 mt-5" style="font-family:'Great Vibes',cursive; font-size:3.5rem;">
            Nossos Chefes
        </h2>

        <div class="row g-4 justify-content-center">
            {% for chefe in chefes %}
            <div class="col-md-4">
                <div class="contact-card p-0 overflow-hidden rounded-4 text-center">
                    <img src="{{ url_for('static', filename='imagens/' + chefe.imagem) }}" class="img-fluid w-100" style="height:350px; object-fit:cover;" alt="{{ chefe.nome }}">
                    <div class="p-4">
                        <h5 class="text-danger mb-1">{{ chefe.nome }}</h5>
                        <p class="text-white-50">{{ chefe.cargo }}</p>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center text-white-50">
                <p>Nenhum chefe cadastrado no momento.</p>
            </div>
            {% endfor %}
        </div>

        <div class="text-center mt-5">
            <a href="{{ url_for('homepage') }}" class="btn btn-danger px-5 py-3 rounded-pill">
                Voltar
            </a>
        </div>
    </main>

    <footer>
        <p>© 2025 Confeitaria Luar Rubro - São Paulo - SP</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/chefes.js') }}"></script>
</body>

</html>
