<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Cadastro

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container py-5">

<h1 class="mb-4">

Criar Conta

</h1>


{% if mensagem %}

<div class="alert alert-warning">

{{ mensagem }}

</div>

{% endif %}


<form method="POST">

<div class="mb-3">

<label>

Nome

</label>

<input

type="text"

name="nome"

class="form-control"

required>

</div>


<div class="mb-3">

<label>

Email

</label>

<input

type="email"

name="email"

class="form-control"

required>

</div>


<button

type="submit"

class="btn btn-danger">

Cadastrar

</button>

</form>


<div class="mt-4">

<a
href="/"
class="btn btn-outline-light">

Voltar ao início

</a>

</div>

</div>

</body>

</html>
