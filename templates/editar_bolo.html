<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Editar Bolo

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body class="bg-dark text-white">


<div class="container py-5">


<h1 class="text-center mb-5">

Editar Bolo

</h1>


<div
class="mx-auto p-4 rounded-4"
style="
max-width:700px;
background:#1c1c1c;
">

<form method="POST">


<div class="mb-4">

<label class="form-label">

Nome

</label>

<input
type="text"
name="nome"
class="form-control"
value="{{ bolo.nome }}"
required>

</div>


<div class="mb-4">

<label class="form-label">

Preço

</label>

<input
type="number"
step="0.01"
name="preco"
class="form-control"
value="{{ bolo.preco }}"
required>

</div>


<div class="mb-4">

<label class="form-label">

Descrição

</label>

<textarea
name="descricao"
class="form-control"
rows="4"
required>{{ bolo.descricao }}</textarea>

</div>


<div class="mb-4">

<label class="form-label">

Imagem

</label>

<input
type="text"
name="imagem"
class="form-control"
value="{{ bolo.imagem }}"
required>

</div>


<button
type="submit"
class="btn btn-warning w-100">

Salvar Alterações

</button>


<a
href="/admin/bolos"
class="btn btn-outline-light w-100 mt-3">

Voltar

</a>


</form>


</div>


</div>

</body>

</html>
