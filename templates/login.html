<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Luar Rubro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0d0d0d;
            color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: #161616;
            border: 1px solid #282828;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #dc3545;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .btn-danger-custom {
            background-color: #dc3545;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .btn-danger-custom:hover {
            background-color: #bb2d3b;
            color: white;
        }

        .form-control-dark {
            background-color: #212529;
            border: 1px solid #343a40;
            color: #fff;
            border-radius: 8px;
            padding: 10px 15px;
        }

        .form-control-dark:focus {
            background-color: #2b3035;
            border-color: #dc3545;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
        }

        a.link-custom {
            color: #aaa;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a.link-custom:hover {
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">Luar Rubro</h1>
        <p class="text-center text-white-50 mb-4">Entre na sua conta para continuar</p>

        {% if mensagem %}
            <div class="alert alert-danger py-2 text-center" role="alert">
                <small>{{ mensagem }}</small>
            </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="email" class="form-label small text-white-50">E-mail</label>
                <input type="email" class="form-control form-control-dark" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="senha" class="form-label small text-white-50 mb-0">Senha</label>
                    <a href="/esqueci-senha" class="link-custom small">Esqueci a senha</a>
                </div>
                <input type="password" class="form-control form-control-dark" id="senha" name="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-danger-custom w-100 mt-3">Entrar</button>
        </form>

        <hr class="border-secondary my-4">

        <div class="text-center">
            <span class="small text-white-50">Ainda não tem uma conta?</span><br>
            <a href="/cadastro" class="link-custom fw-bold small">Cadastre-se aqui</a>
        </div>

        <div class="text-center mt-3">
            <a href="/" class="link-custom small"><i class="fas fa-arrow-left me-1"></i> Voltar para o site</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
